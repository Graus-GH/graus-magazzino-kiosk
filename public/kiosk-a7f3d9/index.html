<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>GRAUS Fleet — Cruscotto Magazzino</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/kiosk-a7f3d9/style.css?v=1" />
</head>
<body>

  <div id="kiosk">

    <header class="k-header">
      <div class="k-brand">
        <img class="k-brand-mark" src="https://firebasestorage.googleapis.com/v0/b/graus-website.firebasestorage.app/o/uploads%2F1783928606742-1CaXk68QPYFnSibPMj4fOxvLB0sejKVUL_1_.webp?alt=media" alt="GRAUS">
        <span class="k-brand-sub">Cruscotto Flotta — Magazzino</span>
        <a href="/kiosk-a7f3d9/soste.html" class="k-nav-link">Analisi soste →</a>
      </div>
      <div class="k-live">
        <span class="k-live-dot"></span>
        <span id="k-clock">--:--:--</span>
      </div>
    </header>

    <main class="k-main">

      <section class="k-map-section">
        <div id="k-map"></div>
        <div class="k-map-legend">
          <span class="k-legend-item"><i class="k-dot k-dot--moving"></i>In movimento</span>
          <span class="k-legend-item"><i class="k-dot k-dot--stopped"></i>Fermo</span>
          <span class="k-legend-item"><i class="k-dot k-dot--offline"></i>Offline</span>
        </div>
      </section>

      <aside class="k-rail">

        <div class="k-kpis">
          <div class="k-kpi">
            <span class="k-kpi-value" id="kpi-total">–</span>
            <span class="k-kpi-label">Veicoli</span>
          </div>
          <div class="k-kpi">
            <span class="k-kpi-value k-kpi-value--moving" id="kpi-moving">–</span>
            <span class="k-kpi-label">In movimento</span>
          </div>
          <div class="k-kpi">
            <span class="k-kpi-value k-kpi-value--stopped" id="kpi-stopped">–</span>
            <span class="k-kpi-label">Fermi</span>
          </div>
          <div class="k-kpi">
            <span class="k-kpi-value" id="kpi-km">–</span>
            <span class="k-kpi-label">Km oggi</span>
          </div>
        </div>

        <div class="k-panel">
          <h2 class="k-panel-title">Meno soste oggi</h2>
          <p class="k-panel-sub">Veicoli più efficienti — meno tempo fermo</p>
          <div id="k-leaderboard" class="k-list"></div>
        </div>

        <div class="k-panel k-panel--grow">
          <h2 class="k-panel-title">Soste per veicolo</h2>
          <div id="k-stops" class="k-list k-list--scroll"></div>
        </div>

      </aside>

    </main>

    <footer class="k-footer">
      <span id="k-updated">Aggiornamento in corso…</span>
    </footer>

  </div>

  <script src="/kiosk-a7f3d9/main.js?v=1"></script>
</body>
</html>
