<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GRAUS Fleet — Fotovoltaico</title>

<script src="/kiosk-a7f3d9/layoutMode.js?v=1"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/kiosk-a7f3d9/style.css?v=36" />
<link rel="stylesheet" href="/kiosk-a7f3d9/solar.css?v=8" />
</head>
<body>

  <div id="kiosk">

    <header class="k-header">
      <div class="k-brand">
        <button class="k-menu-toggle" id="k-menu-toggle" aria-label="Menu" title="Menu">☰</button>
        <img class="k-brand-mark" src="https://firebasestorage.googleapis.com/v0/b/graus-website.firebasestorage.app/o/uploads%2F1783928606742-1CaXk68QPYFnSibPMj4fOxvLB0sejKVUL_1_.webp?alt=media" alt="GRAUS">
        <span class="k-brand-sub">Energia</span>
        <nav class="k-menu-dropdown" id="k-menu-dropdown">
          <a href="/kiosk-a7f3d9/" class="k-nav-link">← Mappa</a>
          <a href="/kiosk-a7f3d9/soste.html" class="k-nav-link">Analisi soste →</a>
          <a href="/kiosk-a7f3d9/performance.html" class="k-nav-link">Performance →</a>
        </nav>
      </div>
      <div class="k-header-right">
        <div class="k-live">
          <span class="k-live-dot"></span>
          <span id="k-clock">--:--:--</span>
        </div>
        <div class="k-mini-countdown" id="k-mini-countdown">--</div>
      </div>
    </header>

    <main class="sol-main">

      <div class="sol-range-tabs" id="sol-range-tabs">
        <button class="sol-range-tab" data-range="yesterday">Ieri</button>
        <button class="sol-range-tab sol-range-tab--active" data-range="today">Oggi</button>
        <button class="sol-range-tab" data-range="last30">Ultimi 30 giorni</button>
        <button class="sol-range-tab" data-range="monthly">Ultimi 12 mesi</button>
        <div class="k-rotate-icon" id="sol-rotate-icon" title="Prossimo periodo">
          <svg class="k-rotate-ring" viewBox="0 0 36 36">
            <circle class="k-rotate-ring-bg" cx="18" cy="18" r="15"></circle>
            <circle class="k-rotate-ring-fg" id="sol-rotate-ring" cx="18" cy="18" r="15"></circle>
          </svg>
        </div>
      </div>

      <!-- Each tile's thin bar and caption use the same colors as the chart
           below: green = self-consumed, violet = fed into the grid, amber =
           bought from the grid. Filled in by renderKpis() in solar.js. -->
      <div class="sol-kpis">
        <div class="k-panel sol-kpi-block">
          <span class="sol-big-number" id="sol-produced">–</span>
          <span class="k-kpi-label">Energia prodotta</span>
          <div class="sol-kpi-bar" id="sol-produced-bar"></div>
          <div class="sol-kpi-split" id="sol-produced-split"></div>
        </div>
        <div class="k-panel sol-kpi-block">
          <span class="sol-big-number" id="sol-consumed">–</span>
          <span class="k-kpi-label">Energia consumata</span>
          <div class="sol-kpi-bar" id="sol-consumed-bar"></div>
          <div class="sol-kpi-split" id="sol-consumed-split"></div>
        </div>
        <div class="k-panel sol-kpi-block">
          <span class="sol-big-number sol-big-number--self" id="sol-selfcons">–</span>
          <span class="k-kpi-label">Autoconsumo</span>
          <div class="sol-kpi-bar" id="sol-selfcons-bar"></div>
          <div class="sol-kpi-split" id="sol-selfcons-split"></div>
        </div>
        <div class="k-panel sol-kpi-block">
          <span class="sol-big-number sol-big-number--purchased" id="sol-grid">–</span>
          <span class="k-kpi-label">Prelevata dalla rete</span>
          <div class="sol-kpi-bar" id="sol-grid-bar"></div>
          <div class="sol-kpi-split" id="sol-grid-split"></div>
        </div>
      </div>

      <div class="k-panel sol-chart-panel">
        <div class="sol-chart-head">
          <div>
            <h2 class="k-panel-title" id="sol-chart-title">Oggi — ogni 15 minuti</h2>
            <p class="k-panel-sub">Sopra la linea la produzione, sotto il consumo</p>
          </div>
          <div class="sol-live-power">
            <span class="sol-live-power-value" id="sol-power-live">–</span>
            <span class="k-kpi-label">Potenza attuale</span>
          </div>
        </div>

        <div class="sol-flow-legend">
          <span class="sol-flow-legend-item"><i class="sol-flow-dot sol-flow-dot--self"></i>Autoconsumo</span>
          <span class="sol-flow-legend-item"><i class="sol-flow-dot sol-flow-dot--feedin"></i>Immessa in rete</span>
          <span class="sol-flow-legend-item"><i class="sol-flow-dot sol-flow-dot--purchased"></i>Prelevata dalla rete</span>
        </div>

        <div class="sol-flow-wrap">
          <!-- The labels are rotated 180deg to read bottom-to-top, which also
               flips the arrow glyphs — hence ▼ here renders as ▲ and vice versa. -->
          <div class="sol-flow-axis sol-flow-axis--hidden">
            <span class="sol-flow-axis-label">▼ Produzione</span>
            <span class="sol-flow-axis-label">▲ Consumo</span>
          </div>
          <div id="sol-chart" class="sol-flow-chart"></div>
        </div>
      </div>

    </main>

  </div>

  <script src="/kiosk-a7f3d9/keyPersist.js?v=3"></script>
  <script src="/kiosk-a7f3d9/solar.js?v=9"></script>
</body>
</html>
