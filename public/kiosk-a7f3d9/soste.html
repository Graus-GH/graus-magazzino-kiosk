<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GRAUS Fleet — Analisi Soste</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/kiosk-a7f3d9/style.css?v=2" />
<link rel="stylesheet" href="/kiosk-a7f3d9/soste.css?v=2" />
</head>
<body>

  <div id="kiosk">

    <header class="k-header">
      <div class="k-brand">
        <img class="k-brand-mark" src="https://firebasestorage.googleapis.com/v0/b/graus-website.firebasestorage.app/o/uploads%2F1783928606742-1CaXk68QPYFnSibPMj4fOxvLB0sejKVUL_1_.webp?alt=media" alt="GRAUS">
        <span class="k-brand-sub">Analisi Soste per Veicolo</span>
        <a href="/kiosk-a7f3d9/" class="k-nav-link">← Mappa</a>
      </div>
      <div class="k-live">
        <span class="k-live-dot"></span>
        <span id="k-clock">--:--:--</span>
      </div>
    </header>

    <main class="s-main">

      <div class="s-top-row">
        <div class="k-panel s-leaderboard">
          <h2 class="k-panel-title">Meno soste oggi</h2>
          <p class="k-panel-sub">Veicoli più efficienti — meno tempo fermo</p>
          <div id="s-leaderboard" class="k-list"></div>
        </div>

        <div class="k-panel s-chart">
          <h2 class="k-panel-title">Soste per fascia oraria</h2>
          <p class="k-panel-sub">Numero di soste registrate su tutta la flotta</p>
          <div id="s-chart" class="s-chart-bars"></div>
        </div>
      </div>

      <div id="s-vehicles" class="s-columns">
        <p class="k-empty">Caricamento…</p>
      </div>
    </main>

    <footer class="k-footer">
      <span id="k-updated">Aggiornamento in corso…</span>
      <span class="k-countdown-sep">·</span>
      <span id="k-countdown">--</span>
    </footer>

  </div>

  <script src="/kiosk-a7f3d9/soste.js?v=2"></script>
</body>
</html>
